# /**:
#   ros__parameters:
#     # ============================================================
#     # Common sector range
#     # - free_space_model_node와 free_space_marker_node가 함께 사용
#     # - 튜닝 시 여기만 바꾸면 판단 로직과 시각화가 같이 바뀜
#     # ============================================================

#     front_min_deg: -20.0
#     front_max_deg: 20.0

