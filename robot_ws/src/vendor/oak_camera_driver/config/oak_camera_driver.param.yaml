oak_camera_driver_node:
  ros__parameters:
    fps: 15                # 카메라 캡처 fps (OAK 디바이스 설정)
    publish_fps: 5         # ROS2 토픽 publish fps (Jetson 부하 경감)
    # victim_detection bbox 좌표 정규화 기준 해상도
    rgb_width: 480
    rgb_height: 270
    show_preview: false    # true로 변경하면 미리보기 창 활성화
    preview_width: 480
    preview_height: 270
