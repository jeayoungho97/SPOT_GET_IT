classical_gait_node:
  ros__parameters:
    rate_hz: 50.0

    # ============================================================
    # IK link parameters (실제 robot 측정값)
    # ============================================================
    l1_x_m: 0.03           # thigh joint X offset
    l1_z_m: 0.13           # thigh length (Z 성분)
    l2_m: 0.110            # shin length
    body_height_m: 0.20    # default stance body height
    robot_width_m: 0.15    # hip-to-hip width (for wz → stride L/R 변환)

    # ============================================================
    # Gait parameters
    # ============================================================
    gait_period_s: 0.6     # 한 cycle (rl_locomotion 과 동일)
    duty_factor: 0.5       # stance 비율 (0.5 = pure trot)
    step_height_m: 0.03    # swing 최고점 (지면 위 30mm)
    phase_cmd_norm: 0.1    # cmd_norm 이 이 값 이상이면 phase 진행 (정지 판정 임계)
    blend_cmd_norm: 0.1    # cmd_norm 이 이 값 이하면 default pose 와 blend

    # ============================================================
    # cmd_vel limits (학습 컨벤션과 동일 범위)
    # ============================================================
    vx_min: 0.0
    vx_max: 0.40
    vy_min: 0.0
    vy_max: 0.0       # strafe 현재 미사용 (IK 식이 vx, wz 만 씀)
    wz_min: -0.40
    wz_max: 0.40

    # ============================================================
    # Default joint angles (STM stand_only 자세 일치)
    # FL/FR/RL/RR 각 leg: (shoulder, thigh, knee)
    # ============================================================
    default_joint_angles:
      - 0.0
      - -0.9269
      - 1.5314
      - 0.0
      - -0.9269
      - 1.5314
      - 0.0
      - -0.9269
      - 1.5314
      - 0.0
      - -0.9269
      - 1.5314

    # ============================================================
    # Joint position limits (rad)
    # ============================================================
    joint_min_rad:
      - -0.548
      - -2.666
      - -0.100
      - -0.548
      - -2.666
      - -0.100
      - -0.548
      - -2.666
      - -0.100
      - -0.548
      - -2.666
      - -0.100

    joint_max_rad:
      - 0.548
      - 1.548
      - 2.590
      - 0.548
      - 1.548
      - 2.590
      - 0.548
      - 1.548
      - 2.590
      - 0.548
      - 1.548
      - 2.590

    # ============================================================
    # Rate limit
    # ============================================================
    max_joint_speed_rad_s: 1.5   # max_delta = 1.5 / 50 = 0.03 rad/step
