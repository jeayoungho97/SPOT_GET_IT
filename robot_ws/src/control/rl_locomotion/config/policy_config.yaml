rl_locomotion_node:
  ros__parameters:
    policy_rate_hz: 50.0

    obs_dim: 47
    action_dim: 12

    action_scale: 0.25
    action_clip: 0.5

    policy_backend: onnx
    model_path: "models/exp043_policy.onnx"
    require_model: true
    obs_clip: 100.0

    gait_period: 0.6
    duty_factor: 0.5
    step_height: 0.03
    body_height: 0.206
    robot_width: 0.15
    phase_cmd_norm: 0.1
    blend_cmd_norm: 0.1

    debug_publish_rate_hz: 2.0

    feedback_timeout_ms: 150.0
    imu_timeout_ms: 150.0
    status_timeout_ms: 150.0

    # 0 MODE_DISABLE
    # 1 MODE_STAND
    # 3 MODE_CROUCH
    # 4 MODE_E_STOP
    safe_mode: 0

    vx_min: 0.0
    vx_max: 0.40
    vy_min: 0.0
