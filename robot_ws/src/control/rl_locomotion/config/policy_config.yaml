      - -0.548
      - -2.666
      - -0.100
      - -0.548
      - -2.666
      - -0.100
      - -0.548
      - -2.666
      - -0.100
      - -0.548
      - -2.666
      - -0.100

    joint_max_rad:
      - 0.548
      - 1.548
      - 2.590
      - 0.548
      - 1.548
      - 2.590
      - 0.548
      - 1.548
      - 2.590
      - 0.548
      - 1.548
      - 2.590

