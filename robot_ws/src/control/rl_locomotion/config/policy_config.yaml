rl_locomotion_node:
  ros__parameters:
    policy_rate_hz: 50.0
    obs_dim: 47
    action_dim: 12
    action_scale: 0.25
    action_clip: 0.5

    gait_period: 0.6
    duty_factor: 0.5
    step_height: 0.03
    body_height: 0.206
    robot_width: 0.15
    phase_cmd_norm: 0.1
    blend_cmd_norm: 0.1

    joint_names:
      - front_left_shoulder
      - front_left_leg
      - front_left_foot
      - front_right_shoulder
      - front_right_leg
      - front_right_foot
      - rear_left_shoulder
      - rear_left_leg
      - rear_left_foot
      - rear_right_shoulder
      - rear_right_leg
      - rear_right_foot

    default_joint_angles:
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1

    max_joint_speed_rad_s: 1.5
    debug_publish_rate_hz: 2.0
