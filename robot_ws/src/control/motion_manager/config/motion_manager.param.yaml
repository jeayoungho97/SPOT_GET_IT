stand_motion_node:
  ros__parameters:
    rate_hz: 50.0

    # 0.03 rad/step at 50Hz = 1.5 rad/s
    max_delta_rad: 0.03

    # 현재 학습/dry-run 기준 기본 자세
    stand_pose:
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1

joint_target_mux_node:
  ros__parameters:
    rate_hz: 50.0

    # 안전 default — launch 직후 robot 은 stand pose 만 유지.
    # RL / classical_gait 노드는 띄워져 있지만 출력은 mux 에서 무시됨.
    # Runtime 에 mode topic 으로 전환:
    #   ros2 topic pub /control/behavior/mode std_msgs/msg/String "data: 'CLASSICAL'" --once
    #   ros2 topic pub /control/behavior/mode std_msgs/msg/String "data: 'RL'"        --once
    #   ros2 topic pub /control/behavior/mode std_msgs/msg/String "data: 'STAND'"     --once
    default_mode: "STAND"

    rl_timeout_ms: 100.0
    stand_timeout_ms: 100.0
    classical_timeout_ms: 100.0