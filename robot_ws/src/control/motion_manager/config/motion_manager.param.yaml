stand_motion_node:
  ros__parameters:
    rate_hz: 50.0

    # 0.03 rad/step at 50Hz = 1.5 rad/s
    max_delta_rad: 0.03

    # 현재 학습/dry-run 기준 기본 자세
    stand_pose:
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1

joint_target_mux_node:
  ros__parameters:
    rate_hz: 50.0

    # RL 보행 활성. RL 노드의 /control/rl/joint_target 을 robot 으로 흘림.
    # 문제 시 ESTOP 또는 "STAND" 로 되돌리면 stand_motion 만 적용됨.
    default_mode: "RL"

    rl_timeout_ms: 100.0
    stand_timeout_ms: 100.0