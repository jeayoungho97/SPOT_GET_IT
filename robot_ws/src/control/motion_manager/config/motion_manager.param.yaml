stand_motion_node:
  ros__parameters:
    rate_hz: 50.0

    # 0.03 rad/step at 50Hz = 1.5 rad/s
    max_delta_rad: 0.03

    # 현재 학습/dry-run 기준 기본 자세
    stand_pose:
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1

joint_target_mux_node:
  ros__parameters:
    rate_hz: 50.0

    # 안전 디버그 모드 — RL 노드는 돌지만 출력 무시, robot 은 stand 자세만 유지.
    # RL 의 observation/디버그 토픽 (rl/debug) 은 그대로 확인 가능.
    # 실 RL 보행 시도할 땐 "RL" 로 변경.
    default_mode: "STAND"

    rl_timeout_ms: 100.0
    stand_timeout_ms: 100.0