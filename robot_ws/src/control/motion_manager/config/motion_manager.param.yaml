stand_motion_node:
  ros__parameters:
    rate_hz: 50.0

    # 0.03 rad/step at 50Hz = 1.5 rad/s
    max_delta_rad: 0.03

    # 현재 학습/dry-run 기준 기본 자세
    stand_pose:
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1

joint_target_mux_node:
  ros__parameters:
    rate_hz: 50.0

    # RL 보행 통합 테스트용 — RL 추론 결과가 mux 를 통과해 STM 으로 전달됨.
    # 안전 운영 시엔 "STAND" 로 변경 (RL 정책 죽으면 자동 fallback).
    default_mode: "RL"

    rl_timeout_ms: 100.0
    stand_timeout_ms: 100.0