actuator_bridge_node:
  ros__parameters:
    control_rate_hz: 50.0
    spi_device: "/dev/spidev0.0"
    spi_speed_hz: 5000000
    spi_mode: 0
    spi_bits_per_word: 8

    use_data_ready: true
    data_ready_gpiochip: "/dev/gpiochip0"
    data_ready_line: 0              # 실제 연결한 Jetson GPIO line 번호로 수정
    data_ready_active_high: true
    data_ready_timeout_us: 5000
    data_ready_poll_interval_us: 50

    max_target_age_ms: 200.0
    freeze_seq_when_stale: true
    target_topic: "/control/selected/joint_target"

    default_joint_angles:
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1
      - 0.0
      - -0.6
      - 1.1

    default_max_delta_rad:
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03
      - 0.03