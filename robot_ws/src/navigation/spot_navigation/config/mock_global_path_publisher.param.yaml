mock_global_path_publisher_node:
  ros__parameters:
    # 이 mock global path가 할당될 로봇 ID.
    robot_id: "spot_01"

    # 팀원 planning 노드와 동일한 global path 출력 토픽.
    global_path_topic: "/planning/mock_global_path/spot_01"

    # 팀원 데이터의 frame_id가 map이므로 동일하게 맞춘다.
    map_frame: "mission_map"

    # 각 waypoint가 의미하는 로봇 기준 frame.
    base_frame: "base_link"

    # 첨부된 global path echo에서 모든 waypoint z_m이 0.05로 들어간다.
    default_z_m: 0.05

    # global path는 자주 갱신될 필요가 없으므로 1Hz로 시작한다.
    publish_rate_hz: 1.0

    # 빨간색 global path의 x 좌표 목록.
    waypoint_x: [
      2.0, 2.33, 2.67, 3.0,
      3.0, 3.0, 3.0, 3.0, 3.0, 3.0,
      3.48, 3.96, 4.45, 4.93, 5.41, 5.89, 6.38, 6.86,
      7.34, 7.82, 8.31, 8.79, 9.27, 9.75, 10.24, 10.72, 11.2
    ]

    # 빨간색 global path의 y 좌표 목록.
    waypoint_y: [
      1.0, 1.33, 1.67, 2.0,
      2.5, 3.0, 3.5, 4.0, 4.5, 5.0,
      5.12, 5.24, 5.35, 5.47, 5.59, 5.71, 5.82, 5.94,
      6.06, 6.18, 6.29, 6.41, 6.53, 6.65, 6.76, 6.88, 7.0
    ]

    # 각 waypoint의 yaw 값.
    # 초반 대각선 구간: 약 45도
    # 수직 상승 구간: 약 90도
    # 후반 완만한 대각선 구간: 약 13.7도
    waypoint_yaw_rad: [
      0.785398, 0.785398, 0.785398, 1.570796,
      1.570796, 1.570796, 1.570796, 1.570796, 1.570796, 0.239232,
      0.239232, 0.239232, 0.239232, 0.239232, 0.239232, 0.239232, 0.239232, 0.239232,
      0.239232, 0.239232, 0.239232, 0.239232, 0.239232, 0.239232, 0.239232, 0.239232, 0.239232
    ]